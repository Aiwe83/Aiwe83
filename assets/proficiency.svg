<svg xmlns="http://www.w3.org/2000/svg" width="520" height="326" viewBox="0 0 520 326" role="img" aria-label="Self-rated proficiency">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff006e"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="python" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <linearGradient id="fastapi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c2a8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f05032"/>
      <stop offset="100%" stop-color="#ff8a65"/>
    </linearGradient>
    <linearGradient id="cobol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005ca9"/>
      <stop offset="100%" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="docker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2496ed"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="langgraph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="sql" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="mongo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#47a248"/>
      <stop offset="100%" stop-color="#8be36b"/>
    </linearGradient>
    <linearGradient id="elastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005571"/>
      <stop offset="100%" stop-color="#f04e98"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="520" height="326" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="518" height="324" rx="13" fill="none" stroke="#30363d"/>
  <rect x="22" y="18" width="476" height="40" rx="9" fill="url(#header)"/>
  <text x="260" y="44" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Self-rated proficiency</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    <g transform="translate(38 82)">
      <text x="0" y="16">Python</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="url(#python)" filter="url(#glow)"/>
      <text x="450" y="16" text-anchor="end">100%</text>
    </g>
    <g transform="translate(38 108)">
      <text x="0" y="16">FastAPI</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="285" height="20" rx="7" fill="url(#fastapi)"/>
      <text x="450" y="16" text-anchor="end">95%</text>
    </g>
    <g transform="translate(38 134)">
      <text x="0" y="16">Git</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="270" height="20" rx="7" fill="url(#git)"/>
      <text x="450" y="16" text-anchor="end">90%</text>
    </g>
    <g transform="translate(38 160)">
      <text x="0" y="16">COBOL</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="255" height="20" rx="7" fill="url(#cobol)"/>
      <text x="450" y="16" text-anchor="end">85%</text>
    </g>
    <g transform="translate(38 186)">
      <text x="0" y="16">Docker</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="240" height="20" rx="7" fill="url(#docker)"/>
      <text x="450" y="16" text-anchor="end">80%</text>
    </g>
    <g transform="translate(38 212)">
      <text x="0" y="16">LangGraph</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="240" height="20" rx="7" fill="url(#langgraph)"/>
      <text x="450" y="16" text-anchor="end">80%</text>
    </g>
    <g transform="translate(38 238)">
      <text x="0" y="16">SQL</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="225" height="20" rx="7" fill="url(#sql)"/>
      <text x="450" y="16" text-anchor="end">75%</text>
    </g>
    <g transform="translate(38 264)">
      <text x="0" y="16">MongoDB</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="210" height="20" rx="7" fill="url(#mongo)"/>
      <text x="450" y="16" text-anchor="end">70%</text>
    </g>
    <g transform="translate(38 290)">
      <text x="0" y="16">Elastic</text>
      <rect x="118" y="0" width="300" height="20" rx="7" fill="#20262e"/>
      <rect x="118" y="0" width="195" height="20" rx="7" fill="url(#elastic)"/>
      <text x="450" y="16" text-anchor="end">65%</text>
    </g>
  </g>
</svg>
